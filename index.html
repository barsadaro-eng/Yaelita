<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yael - Galería Protegida</title>
    <!-- Tailwind CSS -->
    <script src="https://tailwindcss.com"></script>
    <!-- Font Awesome para Iconos -->
    <link href="https://cloudflare.com" rel="stylesheet">
    
    <style>
        @import url('https://googleapis.com');

        :root {
            --magenta-main: #FFB7C5; 
            --gold-brown: #AA7522;
            --gold-shine: #E6C885; 
            --bg-deep: #050203; 
        }

        body {
            font-family: 'Outfit', sans-serif;
            color: white;
            min-height: 100vh;
            cursor: none; /* Oculta el cursor nativo */
            overflow-x: hidden;
            background-color: #000; 
            overscroll-behavior-y: none; /* Previene rebote en iOS */
        }

        /* --- FONDO ANIMADO "DEEP VOID" --- */
        #animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -5;
            background: linear-gradient(135deg, #000000, #0f0508, #050200, #000000);
            background-size: 400% 400%;
            animation: midnightMove 15s ease infinite;
        }

        @keyframes midnightMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- EFECTO DE ESTRELLAS --- */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -4;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background-color: #fff;
            border-radius: 50%;
            pointer-events: none;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* --- CURSOR PERSONALIZADO --- */
        #custom-cursor {
            position: fixed;
            width: 10px;
            height: 10px;
            background-color: var(--magenta-main);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.2s, height 0.2s;
        }

        /* --- PROTECCIÓN CSS PARA IMÁGENES --- */
        img {
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none; /* Evita cualquier interacción directa */
        }
    </style>
</head>
<body class="relative min-h-screen flex flex-col justify-between">

    <!-- Capas de Fondo y Cursor -->
    <div id="animated-bg"></div>
    <div id="stars-container"></div>
    <div id="custom-cursor"></div>

    <!-- Contenido Principal -->
    <main class="flex flex-col items-center justify-center flex-grow p-4">
        <h1 class="text-4xl md:text-6xl font-semibold mb-2 tracking-wide" style="color: var(--magenta-main);">Yael</h1>
        <p class="font-light tracking-widest text-gray-400 uppercase text-xs mb-12">Galería Protegida</p>

        <!-- CONTENEDOR DE LA IMAGEN CON CAPA PROTECTORA INVISIBLE -->
        <div class="relative inline-block rounded-lg overflow-hidden border border-zinc-800 shadow-2xl max-w-md w-full">
            
            <!-- Tu Foto Real -->
            <img src="https://unsplash.com" 
                 alt="Obra de Arte" 
                 class="block w-full h-auto">
            
            <!-- Capa Invisible Protectora (Bloquea clics y arrastres directos) -->
            <div class="absolute inset-0 bg-transparent z-10 select-none cursor-none"></div>
            
        </div>

        <p class="text-xs text-zinc-500 mt-4 font-light"><i class="fa-solid fa-lock mr-1"></i> Imágenes protegidas contra copia directa</p>
    </main>

    <!-- Scripts -->
    <script>
        // 1. Generación dinámica de estrellas
        const container = document.getElementById('stars-container');
        const starCount = 120; 

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 2 + 1; // Tamaños entre 1px y 3px
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            
            container.appendChild(star);
        }

        // 2. Movimiento del Cursor Personalizado
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = `${e.clientX}px`;
            cursor.style.top = `${e.clientY}px`;
        });

        // 3. Script de Protección JavaScript (Bloqueo de Clic Derecho en todo el documento)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault(); 
        });

        // 4. Bloqueo de combinaciones de teclas de inspección (Ctrl+Shift+I, Ctrl+U, F12)
        document.addEventListener('keydown', function(e) {
            if (e.keyCode === 123 || // F12
                (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
                (e.ctrlKey && e.shiftKey && e.keyCode === 4) || // Ctrl+Shift+C
                (e.ctrlKey && e.keyCode === 85)) { // Ctrl+U
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
