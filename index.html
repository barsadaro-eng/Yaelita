<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link rel="icon" href="https://github.io"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="theme-color" content="#000000"/>
  <meta name="description" content="Kaay - Xatspace"/>
  <title>Kaay - Xatspace</title>
  
  <!-- Enlace a la hoja de estilos externa del framework de Xatspaces -->
  <link rel="stylesheet" href="https://github.io">

  <style>
    /* Ajuste para eliminar márgenes del navegador */
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0e11;
    }
  </style>
</head>
<body>

  <!-- Esta estructura exacta activa las clases integradas en el archivo CSS externo -->
  <div id="root">
    <div class="App">
      <div class="content_page">
        <div class="page_header">
          
          <!-- Banner Principal -->
          <div class="header_banner">
            <img src="https://posting.cc" alt="banner" />
          </div>
          
          <!-- Contenedor del Menú con estilos idénticos -->
          <div class="header_content">
            <div class="header_content_menu">
              <a href="https://xat.com/Trade" target="_blank" rel="noreferrer">
                <!-- Icono SVG oficial -->
                <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 20 20" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                  <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l1.293 1.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                <span>Trade</span>
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</body>
</html>
